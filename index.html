/* ---- live orders + notifications ---- */
function toast(m){const e=$("ts");e.textContent=m;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{e.hidden=true},6000)}
function ding(){try{AC.resume();[0,.3,.6].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.18)})}catch(e){}}
function listen(){if(!DB||unsub)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
unsub=DB.collection("orders").onSnapshot(s=>{LIVE=true;DO=s.docs.map(d=>d.data());if(!first)s.docChanges().forEach(c=>{if(c.type==="added"){const o=c.doc.data();ding();toast(w("no",o.id)+" · "+money(o.total));document.title="🔔 "+w("nw");try{if(Notification.permission==="granted")new Notification(w("nw")+" #"+o.id,{body:o.name+" · "+money(o.total)})}catch(e){}}});first=false;if(inOwner())owner()},()=>{LIVE=false;unsub=null})}
function watch(){DB.collection("products").onSnapshot(s=>{if(s.docs.length){P=s.docs.map(d=>d.data()).sort((a,b)=>(a.o||0)-(b.o||0))}else if(OWN){DEF.forEach(p=>DB.doc("products/"+p.id).set(p).catch(fail))}grid();bar();if(inOwner())owner()},()=>{});
DB.doc("shop/config").onSnapshot(s=>{if(s.exists){Object.assign(ST,s.data());head();grid();bar()}},()=>{})}
